name: Feature request
description: Something the plugin should do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to build and where the current API stops you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Sketch the call you wish existed. A code block is ideal.
      render: csharp
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - iOS
        - Both
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workaround today
      description: How you get by without it, if you do.
