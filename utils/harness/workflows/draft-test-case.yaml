# draft-test-case: the first workflow block. Schema and rationale: docs/harness/2026-11-04-qa-test-case-workflow-design.md (sections 2 to 5).
workflow: draft-test-case
version: 1
description: An agent drafts a Test Case from a story's acceptance criteria. QA approves it by moving it to Ready.
subject: { platform: boards, types: [User Story] }

trigger:
  events: [tag, dispatch]
  tag: needs-qa
  eligible:
    - tagSet: { record: subject, tag: needs-qa }
    - fieldPresent: { record: subject, field: Microsoft.VSTS.Common.AcceptanceCriteria }
    - notLinked: { from: subject, type: Tested By, toType: Test Case }
    - noOpenTask: {}

reads:
  - { name: story, from: workItems, record: subject, fields: [System.Id, System.Title, System.Description, System.AreaPath, System.IterationPath], transform: text }
  - { name: criteria, from: workItems, record: subject, field: Microsoft.VSTS.Common.AcceptanceCriteria, transform: criteria }

task:
  writes:
    - create: { name: testCase, type: Test Case, fields: [System.Title, Microsoft.VSTS.TCM.Steps, System.Tags, System.AreaPath, System.IterationPath] }
    - link: { from: subject, type: Tested By, to: testCase }
    - comment: { record: subject }
  prompt: |
    # Task {{task.id}}: Draft a Test Case for a story

    Draft one Test Case in Azure Boards from the story's acceptance criteria. QA will read it and decide.

    Story:
    {{story}}

    Acceptance criteria, with the ids you must cite:
    {{criteria}}

    Do this:
    1. Create one Test Case with the story's title, area path and iteration path.
    2. Write the steps. Each has an action and an expected result. Put every screen, control or message you
       name in double quotes, in the words of the criteria. End each step with the ids it covers, like [AC2].
       Cover every criterion. Do not use shared steps.
    3. Tag it AI-Drafted and link the story to it with Tested By. Leave it in Design; never set Ready or Closed.
    4. Change nothing else on the story or the Test Case.
    5. Write {{task.result.path}} with the schema below, then hand over:
       harness submit draft-test-case {{task.subject.id}} --result {{task.result.path}}
       Without the harness, post the result comment on the story yourself, in the format below.
    6. If the criteria are missing, contradictory or too vague to test, create nothing: write status
       cannot-complete with the reason and your questions, and hand over the same way.
    The checks below run after you hand over. You cannot change them.

checks:
  - { id: tested-by-link, kind: mechanical, rule: { linked: { from: subject, type: Tested By, to: testCase } }, says: "The story links the Test Case with Tested By." }
  - { id: ai-generated-tag, kind: mechanical, rule: { tagSet: { record: testCase, tag: AI-Drafted } }, says: "The Test Case carries the AI-Drafted tag." }
  - { id: left-in-design, kind: mechanical, rule: { stateIs: { record: testCase, state: Design, at: handover } }, says: "The agent left the Test Case in Design." }
  - { id: drafted-by-agent, kind: mechanical, rule: { createdByPerformer: { record: testCase } }, says: "The agent that took the task created the Test Case." }
  - { id: same-area, kind: mechanical, rule: { fieldEquals: { record: testCase, field: System.AreaPath, sameAs: { record: subject, field: System.AreaPath } } }, says: "The Test Case is in the story's area path." }
  - { id: only-allowed-writes, kind: mechanical, rule: { onlyAllowedWrites: {} }, says: "The agent changed nothing outside task.writes." }
  - { id: step-count, kind: mechanical, rule: { stepCount: { record: testCase, min: 1, max: 20 } }, says: "The Test Case has 1 to 20 steps." }
  - { id: expected-results, kind: mechanical, rule: { everyStepHasExpected: { record: testCase } }, says: "Every step has an expected result." }
  - { id: steps-cite-criteria, kind: mechanical, rule: { everyStepCites: { record: testCase, criteria: criteria } }, says: "Every step cites an existing acceptance criterion." }
  - { id: every-criterion-covered, kind: mechanical, rule: { everyCriterionCovered: { record: testCase, criteria: criteria } }, says: "Every acceptance criterion is cited by at least one step." }
  - { id: names-from-criteria, kind: mechanical, rule: { everyStepNamesFromCriteria: { record: testCase, criteria: criteria } }, says: "Every step names a screen, control or message from a criterion it cites." }
  - { id: names-outside-criteria, kind: flag, rule: { namesOutsideCriteria: { record: testCase, criteria: criteria } }, says: "Names in the steps that no criterion uses." }
  - { id: criteria-changed, kind: flag, rule: { criteriaUnchanged: { criteria: criteria } }, says: "The criteria changed after the task was issued." }
  - { id: agent-questions, kind: flag, rule: { agentQuestions: {} }, says: "Questions the agent left for QA." }
  - { id: steps-mean-it, kind: flag, rule: { humanReads: { question: "Do the steps test what each criterion means, on the screens it names?" } }, says: "For QA to answer." }

approval:
  record: testCase
  approve: { stateIs: { record: testCase, state: Ready } }
  deny: { stateIs: { record: testCase, state: Closed } }
  by: notPerformer
  role: QA

digest: { record: testCase, fields: [System.Title, Microsoft.VSTS.TCM.Steps, System.Tags] }
budget: { maxAttempts: 3 }
audit: { task: subject, verdict: testCase, chain: pullRequest }
